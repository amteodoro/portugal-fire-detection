<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portugal Fire Detection</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="/static/css/styles.css"/>
</head>
<body>
  <div id="app">
    <div id="map"></div>
    <div id="sidebar">
      <h2>Portugal Fire Detection</h2>
      <h3>Active Fire Layers</h3>
      <div class="layer-controls">
        <label>
          <input type="checkbox" id="viirsToggle" checked/> 
          VIIRS <span id="viirsCount" class="badge">-</span>
        </label>
        <label>
          <input type="checkbox" id="modisToggle"/> 
          MODIS <span id="modisCount" class="badge">-</span>
        </label>
        <label>
          <input type="checkbox" id="frpToggle"/> 
          Meteosat FRP <span id="frpStatus" class="badge">-</span>
        </label>
      </div>
      <div class="time-controls">
        <label>
          Time Period:
          <select id="fireDays">
            <option value="1" selected>Last 24 hours</option>
            <option value="2">Last 2 days</option>
            <option value="3">Last 3 days</option>
            <option value="7">Last 7 days</option>
            <option value="14">Last 2 weeks</option>
            <option value="30">Last 30 days</option>
            <option value="60">Last 2 months</option>
            <option value="90">Last 3 months</option>
            <option value="180">Last 6 months</option>
            <option value="365">Last year</option>
          </select>
        </label>
        <button id="refreshBtn" class="secondary">Refresh Fire Data</button>
      </div>
      <hr/>
      <h3>Sentinel-2 Search</h3>
      <div class="search-controls">
        <label>
          Days: 
          <input type="number" id="s2Days" min="1" max="30" value="7" style="width: 60px;"/>
        </label><br/>
        <label>
          Cloud%: 
          <input type="number" id="s2Cloud" min="0" max="100" value="20" style="width: 60px;"/>
        </label><br/>
        <button id="s2SearchBtn">Search</button>
      </div>
      <div id="s2Results"></div>
      <hr/>
      <div id="statusBox" class="status-box">
        <h4>Status</h4>
        <div id="statusMessages">Ready to load data...</div>
      </div>
      <hr/>
      <p class="info">
        <small>Data sources: NASA FIRMS (VIIRS/MODIS), EUMETSAT (Meteosat FRP), Copernicus (Sentinel-2)</small>
      </p>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
