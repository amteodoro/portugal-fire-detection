<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portugal Fire Detection</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="/static/css/styles.css"/>
</head>
<body>
  <a href="#map" class="skip-link">Skip to map</a>
  <h1 class="sr-only">Portugal Fire Detection</h1>
  <nav class="navbar">
    <div class="navbar-brand">Portugal Fire Detection</div>
    <ul class="navbar-nav">
      <li class="nav-item">
        <a href="/static/index.html" class="nav-link active">Map View</a>
      </li>
      <li class="nav-item">
        <a href="/static/dataset.html" class="nav-link">Dataset</a>
      </li>
    </ul>
  </nav>
  <div id="app">
    <div id="map"></div>
    <div id="sidebar">
      <div class="card">
        <label>
          <strong>Region</strong>
          <select id="regionSelect">
            <optgroup label="Portugal">
              <option value="mainland" selected>Mainland Portugal</option>
              <option value="madeira">Madeira</option>
              <option value="azores">Açores</option>
              <option value="all">All Portugal Regions</option>
            </optgroup>
            <optgroup label="Test Regions">
              <option value="california">California, USA</option>
              <option value="western_us">Western USA</option>
            </optgroup>
          </select>
        </label>
      </div>

      <div class="card">
        <h2>Active Fire Layers</h2>
        <div class="layer-controls">
          <label>
            <input type="checkbox" id="viirsToggle" checked/>
            VIIRS <span id="viirsCount" class="badge">-</span>
          </label>
          <label>
            <input type="checkbox" id="modisToggle"/>
            MODIS <span id="modisCount" class="badge">-</span>
          </label>
          <label>
            <input type="checkbox" id="frpToggle"/>
            Meteosat FRP <span id="frpStatus" class="badge">-</span>
          </label>
          <label>
            <input type="checkbox" id="heatmapToggle"/>
            Fire Heatmap <span id="heatmapCount" class="badge">-</span>
          </label>
          <label>
            <input type="checkbox" id="s3Toggle"/>
            Sentinel-3 Fire Pixels <span id="s3Count" class="badge">-</span>
          </label>
        </div>
      </div>

      <div class="card">
        <label>
          <strong>Time Period</strong>
          <select id="fireDays">
            <option value="1" selected>Last 24 hours</option>
            <option value="2">Last 2 days</option>
            <option value="3">Last 3 days</option>
            <option value="7">Last 7 days</option>
            <option value="10">Last 10 days</option>
          </select>
        </label>
        <p class="info">FIRMS NRT data limited to 10 days max</p>
        <button id="refreshBtn">Refresh Fire Data</button>
        <button id="exportCsvBtn">Export to CSV</button>
      </div>

      <div class="card">
        <h2>Sentinel-2 Search</h2>
        <div class="search-controls">
          <label>
            Days
            <input type="number" id="s2Days" min="1" max="30" value="7" style="width: 60px;"/>
          </label>
          <label>
            Cloud %
            <input type="number" id="s2Cloud" min="0" max="100" value="20" style="width: 60px;"/>
          </label>
          <button id="s2SearchBtn">Search</button>
        </div>
        <div id="s2Results"></div>
      </div>

      <div class="card">
        <h2>Status</h2>
        <div id="statusMessages" role="status" aria-live="polite">Ready to load data</div>
      </div>

      <div class="card" id="mlStatusCard" style="display:none;">
        <h2>ML Model</h2>
        <div id="mlStatusText" class="ml-status-text"></div>
      </div>

      <p class="info">
        Data sources: NASA FIRMS (VIIRS/MODIS), EUMETSAT (Meteosat FRP), Copernicus (Sentinel-2)
      </p>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script src="https://unpkg.com/supercluster@8.0.1/dist/supercluster.min.js" defer></script>
  <script src="/static/js/app.js" defer></script>
</body>
</html>
