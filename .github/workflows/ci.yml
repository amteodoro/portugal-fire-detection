name: CI

on:
  push:
    branches: ["main", "feature/**", "fix/**", "chore/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Run Tests (Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile', 'pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build test image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          target: test
          tags: portugal-fire-detection:test
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Run tests
        run: |
          docker run --rm \
            -e DEMO_MODE=false \
            -e FIRMS_API_KEY="" \
            -e SCHEDULER_ENABLED=false \
            portugal-fire-detection:test

  docker-smoke:
    name: Docker Startup Smoke Test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build --build-arg INCLUDE_SNAPSHOT=false -t portugal-fire-detection:smoke .

      - name: Start container and health check
        run: |
          docker run --rm -d \
            --name fire-smoke \
            -p 8000:8000 \
            -e DEMO_MODE=false \
            -e FIRMS_API_KEY="" \
            -e SCHEDULER_ENABLED=false \
            portugal-fire-detection:smoke
          # Wait for startup
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/api/health; then
              echo "Health check passed"
              break
            fi
            echo "Waiting... ($i/15)"
            sleep 2
          done

      - name: Stop container
        if: always()
        run: docker stop fire-smoke || true

  deploy-hf-space:
    name: Mirror main to Hugging Face Spaces
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret not set — skipping HF mirror."
            exit 0
          fi
          git config user.email "ci@github.actions"
          git config user.name "GitHub Actions"
          git remote add hf "https://amteodoro:${HF_TOKEN}@huggingface.co/spaces/amteodoro/portugal-fires"
          git push hf main --force
