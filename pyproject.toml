[project]
name = "portugal-fire-detection"
version = "0.1.0"
description = "Portugal multi-source fire detection viewer (FIRMS, Meteosat FRP, Sentinel-2)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "apscheduler>=3.10.4",
  "Pillow>=10.4.0",
  "python-dotenv>=1.0.1",
  "cachetools>=5.3.3",
  "tenacity>=9.0.0",
  "aiofiles>=23.2.1",
  "orjson>=3.10.7",
  "pydantic>=2.0.0",
  "openeo>=0.27.0",
  "pystac-client>=0.7.0",
  "pyyaml>=6.0",
  "tqdm>=4.66.0",
  "rasterio>=1.3.0",
  "numpy>=1.24.0",
  "geopandas>=0.14.0",
  "shapely>=2.0.0"
]

[tool.uv]
dev-dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["portugal_fire_detection"]
